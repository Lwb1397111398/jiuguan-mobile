[project]
name = "tavern-novel-mobile"
version = "0.1.0"
description = "酒馆小说生成器手机版"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "JiuGuan" }
]
dependencies = [
    "flet>=0.86.5",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.5",
    "flet-desktop>=0.86.5",
    "flet-web>=0.86.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.flet]
org = "com.jiuguan"
product = "酒馆小说生成器"
company = "JiuGuan"
copyright = "Copyright (C) 2026 by JiuGuan"

# 只构建 ARM64（现代安卓手机通用架构）：AOT 编译从 3-4 次减到 1 次，大幅省内存省时间
[tool.flet.android]
target_arch = ["arm64-v8a"]

# 7.3GB 内存机器：默认 -Xmx8G 会 OOM（Kotlin daemon 被杀），调小并限制并发
[tool.flet.android.gradle_properties]
"org.gradle.jvmargs" = "-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError"
"kotlin.daemon.jvmargs" = "-Xmx768m"
"org.gradle.workers.max" = "1"
"org.gradle.daemon" = "false"
"android.overridePathCheck" = "true"

[tool.flet.app]
path = "src"
