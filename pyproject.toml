[project]
name = "tavern-novel-mobile"
version = "0.1.0"
description = "酒馆小说生成器手机版"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "JiuGuan" }
]
# 精确 pin 到 2026-11-17 已实测版本（constraints.txt 同源）。
# flet build apk 会读这里给 Android 打独立环境，用 >= 会拉到未实测新版；
# CI 自身的工具链则由 requirements*.txt + constraints.txt 锁定，两者互不干扰。
dependencies = [
    "flet==0.86.5",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "flet-cli==0.86.5",
    "flet-desktop==0.86.5",
    "flet-web==0.86.5",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "PyYAML==6.0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.flet]
org = "com.jiuguan"
product = "酒馆小说生成器"
company = "JiuGuan"
copyright = "Copyright (C) 2026 by JiuGuan"

# 只构建 ARM64（现代安卓手机通用架构）：AOT 编译从 3-4 次减到 1 次，大幅省内存省时间
[tool.flet.android]
target_arch = ["arm64-v8a"]
# 应用内自动更新（2026-11-15）：pyjnius 只打进 Android 包（Python 经它调
# FileProvider/Intent 唤起系统安装器）；桌面 venv 不安装、不受影响
dependencies = ["pyjnius==1.8.0"]

# 自更新安装 APK 的前置权限：Android 8+ 没有它连「安装未知应用」开关页都进不去
[tool.flet.android.permission]
"android.permission.REQUEST_INSTALL_PACKAGES" = true

# 7.3GB 内存机器：默认 -Xmx8G 会 OOM（Kotlin daemon 被杀），调小并限制并发
[tool.flet.android.gradle_properties]
"org.gradle.jvmargs" = "-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError"
"kotlin.daemon.jvmargs" = "-Xmx768m"
"org.gradle.workers.max" = "1"
"org.gradle.daemon" = "false"
"android.overridePathCheck" = "true"

[tool.flet.app]
path = "src"

# shared_preferences_android 2.5+ 自带的 jnigen 绑定要求 jni ^1.1.0，
# flet 模板在 dependency_overrides 硬钉 jni 1.0.0 → 编译期 JniVersionCheck 失败
# （2026-11-15 构建实测）；用 flet 官方扩展点覆盖，新机重建环境仍生效
[tool.flet.flutter.pubspec.dependency_overrides]
jni = "^1.1.0"
